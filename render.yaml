services:
  # Browser-visible origin for the teacher-facing /setup wizard. Proxies
  # /api/installer/* to the installer-test web service below so the
  # installer session cookie is always first-party to this origin -- a
  # browser calling the installer-test host directly treats that cookie as
  # third-party and may silently refuse to store or send it. This route
  # MUST be listed before the SPA catch-all so it wins over "/* -> index.html".
  - type: static
    name: stacking-blocks-math-setup-test
    branch: feature/spatial-math-redesign-v1
    rootDir: apps/stacking-blocks-math-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/installer/*
        destination: https://stacking-blocks-math-installer-test.onrender.com/api/installer/*
      - type: rewrite
        source: /*
        destination: /index.html
    # VITE_INSTALLER_API_URL is intentionally NOT set here: installerClient.ts
    # defaults to this site's own origin, which is what the rewrite above
    # depends on. Only set it to override with a different (non-proxied)
    # installer host for local dev or a special-case deployment.
    #
    # Without this, Render's platform default (public, max-age=0, s-maxage=300)
    # applied uniformly to index.html AND every hashed asset -- a CDN edge can
    # cache the (unhashed, always-same-URL) index.html for up to 5 minutes,
    # and once a browser has cached a body against a given ETag, an edge that
    # keeps re-validating the SAME stale ETag lets that browser keep serving
    # an old bundle reference indefinitely (never actually re-fetching), which
    # is exactly the "fix deployed but a real user's browser still shows the
    # old UI" failure mode this fixes. content-hashed files under /assets/*
    # are safe to cache forever -- a content change always produces a new
    # filename, so there is no staleness risk to trade away.
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
  - type: web
    name: stacking-blocks-math-installer-test
    runtime: node
    branch: feature/spatial-math-redesign-v1
    rootDir: apps/stacking-blocks-math-web
    buildCommand: npm ci
    startCommand: npm run installer:server
    healthCheckPath: /health
    envVars:
      - key: INSTALLER_MODE
        value: TEST
      - key: HOST
        value: 0.0.0.0
      - key: INSTALLER_ALLOWED_PROJECT_REFS
        value: tkniwelldgdlgwavyfdj
      - key: INSTALLER_PRODUCTION_REF
        value: stacking-blocks-math
      - key: INSTALLER_ALLOWED_ORIGIN
        sync: false
      - key: INSTALLER_SESSION_SECRET
        generateValue: true
      # Zero-support OAuth connect: register a Supabase OAuth App (org dashboard,
      # one-time human step) and set these three from its client id/secret and
      # this service's own callback URL. All three must be present together or
      # the server keeps the PAT-only fallback path (see runtime.ts). Never
      # hardcode values here -- sync: false means Render prompts for them once
      # in its dashboard instead of storing them in this file.
      - key: INSTALLER_OAUTH_CLIENT_ID
        sync: false
      - key: INSTALLER_OAUTH_CLIENT_SECRET
        sync: false
      - key: INSTALLER_OAUTH_REDIRECT_URI
        sync: false
