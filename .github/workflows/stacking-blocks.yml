name: Stacking blocks checks
on:
  push:
    paths: ['apps/stacking-blocks-math-web/**', '.github/workflows/stacking-blocks.yml']
  pull_request:
    paths: ['apps/stacking-blocks-math-web/**', '.github/workflows/stacking-blocks.yml']
permissions:
  contents: read
jobs:
  installer-postgres:
    name: Installer native PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: installer_catalog_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d installer_catalog_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/stacking-blocks-math-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/stacking-blocks-math-web/package-lock.json
      - run: npm ci
      - name: Native PostgreSQL catalog and guarded recovery compatibility
        run: node --experimental-strip-types scripts/installer/qa-postgres.ts
        env:
          CI: 'true'
          INSTALLER_PG_DISPOSABLE: 'YES'
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: installer_catalog_ci
          PGUSER: postgres
          PGPASSWORD: disposable-ci-only
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/stacking-blocks-math-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/stacking-blocks-math-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:edge
      - run: npm run test:security
      - run: node --experimental-strip-types scripts/verify-seed.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: math-live-browser-${{ github.sha }}
          path: |
            apps/stacking-blocks-math-web/test-results/
            apps/stacking-blocks-math-web/playwright-report/
          retention-days: 7
